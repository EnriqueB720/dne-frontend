mutation updateSupplier($data: SupplierUpdateInput!) {
  updateSupplier(data: $data) {
    supplierId
    companyName
    slug
    tagline
    description
    businessPhone
    businessEmail
    businessPhoneAlt
    businessEmailAlt
    websiteUrl
    city
    minCapacity
    maxCapacity
    responseTimeMinutes
  }
}
