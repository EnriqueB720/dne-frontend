query supplier($where: SupplierWhereInput!) {
  supplier(where: $where) {
    supplierId
    companyName
    slug
    tagline
    description
    businessPhone
    businessEmail
    businessPhoneAlt
    businessEmailAlt
    websiteUrl
    city
    rating
    reviewCount
    responseTimeMinutes
    minCapacity
    maxCapacity
    verified
    premium
    promotionTier
    promotionStartDate
    promotionEndDate
    media {
      mediaAssetId
      url
      thumbnailUrl
      altText
      displayOrder
    }
    services {
      serviceId
      name
      description
      pricingModel
      basePrice
      currency
    }
    categories {
      categoryId
      isPrimary
      category {
        categoryId
        categoryName
      }
    }
    reviewsReceived {
      reviewId
      rating
      text
      ratingQuality
      ratingCommunication
      ratingValue
      ratingPunctuality
      supplierResponse
      createdAt
      customer {
        customerId
        user {
          userId
          name
        }
      }
    }
  }
}
